name: 🚀 Release

# Fully automatic: on every push to main, if the version in caido.config.ts does
# not yet have a release, build + sign + publish it. Otherwise do nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -oE 'version:[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+"' caido.config.ts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Plugin version: ${VERSION}"

      - name: Check if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.version }} already exists — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New version — will build and release."
          fi

      - name: Setup Node.js
        if: steps.exists.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        if: steps.exists.outputs.skip == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: true

      - name: Build package
        if: steps.exists.outputs.skip == 'false'
        run: pnpm build

      - name: Sign package
        if: steps.exists.outputs.skip == 'false'
        working-directory: dist
        run: |
          if [[ -z "${{ secrets.PRIVATE_KEY }}" ]]; then
            echo "::error::PRIVATE_KEY secret is not set — cannot sign the package."
            exit 1
          fi
          echo "${{ secrets.PRIVATE_KEY }}" > private_key.pem
          openssl pkeyutl -sign -inkey private_key.pem -out plugin_package.zip.sig -rawin -in plugin_package.zip
          rm private_key.pem

      - name: Create release
        if: steps.exists.outputs.skip == 'false'
        uses: caido/action-release@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          commit: ${{ github.sha }}
          body: 'Release ${{ steps.version.outputs.version }}'
          artifacts: 'dist/plugin_package.zip,dist/plugin_package.zip.sig'
          immutableCreate: true
